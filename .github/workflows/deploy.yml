name: Deploy to gh-pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: |
          cd dist
          git init
          git config user.name "kamlali9990-ui"
          git config user.email "kamlali9990-ui@users.noreply.github.com"
          git add -A
          git commit -m "deploy $(date)"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/kamlali9990-ui/thara-app.git HEAD:gh-pages --force
