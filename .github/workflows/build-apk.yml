name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'
      - 'public/manifest.json'
      - 'public/newicon.jpg'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build APK with Bubblewrap
        run: bash build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thara-app-apk
          path: app-release-signed.apk
          if-no-files-found: error

      - name: Commit updated APK
        run: |
          cp app-release-signed.apk public/thara-app.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/thara-app.apk
          git diff --staged --quiet || git commit -m "تحديث APK تلقائياً [skip ci]"
          git push
