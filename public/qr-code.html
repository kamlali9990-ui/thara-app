<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أسواق ثرا الشرق ون - مسح الباركود</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(145deg, #f5f5f7 0%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      direction: rtl;
    }
    .qr-card {
      background: white;
      border-radius: 28px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.04);
    }
    .qr-logo {
      width: 72px; height: 72px; border-radius: 18px;
      object-fit: contain; background: white; padding: 4px;
      box-shadow: 0 4px 16px rgba(18,116,67,0.15);
      margin-bottom: 1rem;
    }
    .qr-title {
      font-size: 1.4rem; font-weight: 900; color: #127443;
      margin-bottom: 0.3rem;
    }
    .qr-subtitle {
      font-size: 0.9rem; color: #64748b;
      margin-bottom: 1.5rem;
    }
    .qr-image-wrap {
      background: #f8fafc;
      padding: 1.5rem;
      border-radius: 20px;
      margin-bottom: 1.5rem;
      border: 1px solid #f1f5f9;
    }
    .qr-image-wrap img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .qr-hint {
      font-size: 0.85rem;
      color: #475569;
      line-height: 1.6;
    }
    .qr-hint strong {
      color: #127443;
    }
    .qr-url {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 0.75rem;
      word-break: break-all;
    }
    @media print {
      body { padding: 0; background: white; }
      .qr-card { box-shadow: none; border: none; padding: 1rem; }
      .qr-hint { display: none; }
      .qr-url { display: none; }
    }
  </style>
</head>
<body>
  <div class="qr-card">
    <img src="LOGO.jpg" alt="ثرا الشرق ون" class="qr-logo" />
    <h1 class="qr-title">أسواق ثرا الشرق ون</h1>
    <p class="qr-subtitle">توصيل طلبات السوبرماركت لباب بيتك في الخفجي</p>
    <div class="qr-image-wrap">
      <img src="qr-code.png" alt="QR Code" />
    </div>
    <p class="qr-hint">
      <strong>امسح الباركود</strong> بكاميرا جوالك<br/>
      لفتح المتجر وتصفح المنتجات
    </p>
    <p class="qr-url">https://kamlali9990-ui.github.io/thara-app/</p>
  </div>
</body>
</html>
